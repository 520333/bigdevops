basePath: /api
definitions:
  common.BaseResp:
    properties:
      code:
        description: 这是的code不是Http的状态码 而是前后端交互定义的
        type: integer
      message:
        type: string
      result: {}
      type:
        type: string
    type: object
  models.K8sCluster:
    properties:
      LastProbErrMsg:
        type: string
      actionTimeoutSeconds:
        type: integer
      annotationsFront:
        type: string
      annotationsM:
        additionalProperties:
          type: string
        type: object
      apiServerAddr:
        description: 不需要用户填入 解析kubeconfig
        type: string
      createUserName:
        type: string
      createdAt:
        type: string
      createdTime:
        type: string
      env:
        type: string
      id:
        type: integer
      key:
        description: 前端表格使用
        type: string
      kubeConfigContent:
        type: string
      labelsFront:
        type: string
      labelsM:
        additionalProperties:
          type: string
        type: object
      lastProbSuccess:
        type: boolean
      name:
        type: string
      nameZh:
        type: string
      updatedAt:
        type: string
      updatedTime:
        type: string
      userID:
        type: integer
      version:
        description: 不需要用户填入 解析kubeconfig发起serverVersion请求
        type: string
    type: object
  models.K8sYamlTask:
    properties:
      applyResult:
        type: string
      clusterName:
        description: 集群名称
        type: string
      createUserName:
        description: 前端表格使用
        type: string
      createdAt:
        type: string
      createdTime:
        type: string
      id:
        type: integer
      key:
        description: 前端表格使用
        type: string
      name:
        type: string
      status:
        type: string
      templateId:
        description: yaml模板id
        type: integer
      templateName:
        description: 前端表格使用
        type: string
      updatedAt:
        type: string
      updatedTime:
        type: string
      userID:
        type: integer
      variables:
        items:
          type: string
        type: array
      variablesFront:
        description: 前端表格使用
        type: string
    type: object
  models.K8sYamlTemplate:
    properties:
      content:
        type: string
      createUserName:
        type: string
      createdAt:
        type: string
      createdTime:
        type: string
      id:
        type: integer
      key:
        description: 前端表格使用
        type: string
      name:
        type: string
      updatedAt:
        type: string
      updatedTime:
        type: string
      userID:
        type: integer
    type: object
  models.UserLoginRequest:
    properties:
      password:
        description: 密码
        maxLength: 20
        minLength: 3
        type: string
      username:
        description: 用户名
        maxLength: 20
        minLength: 3
        type: string
    required:
    - password
    - username
    type: object
  view_server.K8sClusterNodeRequest:
    properties:
      clusterName:
        type: string
      nodeNames:
        items:
          type: string
        type: array
      targetEnable:
        description: '可选: true 允许调度, false 停止调度; 不传则自动翻转'
        type: boolean
    required:
    - clusterName
    - nodeNames
    type: object
  view_server.LabelK8sNodeRequest:
    properties:
      clusterName:
        type: string
      labels:
        description: k=v
        items:
          type: string
        type: array
      nodeNames:
        items:
          type: string
        type: array
      targetEnable:
        description: '可选: true 允许调度, false 停止调度; 不传则自动翻转'
        type: boolean
    required:
    - clusterName
    - nodeNames
    type: object
  view_server.TaintK8sNodeRequest:
    type: object
