# 超管角色名称
super_role_name: super

# 自动工单机器人
work_order_auto_action:
  service_account: auto_order_robot
  run_interval_seconds: 60
  batch_num: 5
  auto_template_name_buy_ecs: "虚拟机购买"
  auto_template_name_rm_ecs: "虚拟机下线"
  auto_template_name_pipeline: "流水线开通申请"
  enable: false

job_exec:
  #  enable: true
  execTimeoutSeconds: 5
  run_interval_seconds: 15

public_cloud_sync:
  # 从公有云同步到本地间隔 单位秒
  run_interval_seconds: 3600
  #  enable: true
  godaddy_dns:
    access_key_id: xxx
    access_key_secret: xxx
    enable: true
    domains:
      - "xxx.com"
      - "xxx.net"
    dynadot_dns:    # 暂不支持
      access_key_id: xxx
      access_key_secret: xxx
  ali_cloud:
    - region_id: "cn-hangzhou"
      access_key_id: "xxx"
      access_key_secret: "xxx"
      enable: true
      account_name: "xxx"
    - region_id: "us-west-1"
      access_key_id: "xxx"
      access_key_secret: "xxx"
      enable: true
      account_name: "xxx"

  aws_cloud:
    - region_id: "ap-east-1"
      access_key_id: "xxx"
      secret_access_key: "xxx"
      enable: true
      account_name: "xxx"

    - region_id: "ap-south-1"
      access_key_id: "xxx"
      secret_access_key: "xxx"
      enable: true
      account_name: "xxx"


monitor_compute:
  enable: true
  exec_timeout_seconds: 5
  run_interval_seconds: 30
  http_sd_api: http://192.168.50.1:8080/noAuth/getLeafStreeNodeBindIps
  alert_web_hook_addr: http://192.168.50.1:8085/receive

