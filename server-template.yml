http_addr: 0.0.0.0:8080
http_request_global_timeout_seconds: 5  # 服务端对外请求全局超时时间
log_level: INFO
log_file_path: json.log
grpc_server_config:
  addr: 0.0.0.0:8083

jwt:
  signing_key: your_jwt_secret_key
  expires_time: 4h # Token 过期时间
  buffer_time: 2h  # 缓冲时间，在此期间刷新页面自动无感平滑续签 Token
  issuer: dawn     # 签发者

alert_manager_api: http://192.168.50.200:9093
enable_swagger: false # 是否开启 Swagger 接口文档页面 (/swagger/index.html)

# 前端访问域名/地址 (用于工单回调通知与邮件链接跳转)
front_domain: "http://localhost:3100"

############ 对接 Keycloak / OIDC 单点登录
oidc:
  enable: true
  issuer: http://192.168.50.100:8080/realms/SSO
  client_id: bigdevops
  client_secret: your_keycloak_client_secret
  redirect_url: http://192.168.10.240:3100/#/oauth/callback

############ 对接钉钉企业单点登录
dingtalk_sso:
  enable: false
  client_id: "your_dingtalk_app_key"
  client_secret: "your_dingtalk_app_secret"
  redirect_uri: "http://192.168.10.240:3100/#/oauth/dingtalk"

############ MinIO / S3 OSS 对象存储配置 (头像、工单附件等)
oss:
  enable: true
  endpoint: 192.168.50.100:9000
  access_key: your_minio_access_key
  secret_key: your_minio_secret_key
  use_ssl: false
  bucket_name: bigdevops-avatars
  url_prefix: http://192.168.50.100:9000/bigdevops-avatars

############ JFrog Artifactory 制品与配置仓库配置
artifactory:
  enable: true
  base_url: "https://artifactory.example.com/artifactory"
  username: "admin"
  password: "your_artifactory_password"

mysql:
  dsn: "root:123456@tcp(192.168.50.100:3306)/bigdevops?charset=utf8mb4&parseTime=True&loc=Local"

# 超管角色名称 (Casbin 策略中具有全量权限的角色标识)
super_role_name: super

# 自动工单机器人
work_order_auto_action:
  service_account: auto_order_robot
  run_interval_seconds: 60
  batch_num: 5
  auto_template_name_buy_ecs: "虚拟机购买"
  auto_template_name_rm_ecs: "虚拟机下线"
  auto_template_name_pipeline: "流水线开通申请"
  enable: false

# 作业平台后台执行引擎
job_exec:
  enable: true
  execTimeoutSeconds: 5
  run_interval_seconds: 15

# K8s 多集群后台状态同步巡检
k8s_cluster:
  enable: false
  run_interval_seconds: 15

# CI/CD 流水线与构建状态后台同步引擎
ci_cd:
  enable: true
  run_interval_seconds: 15

# 公有云资产定时同步 (ECS、RDS、DNS)
public_cloud_sync:
  enable: false
  run_interval_seconds: 3600
  godaddy_dns:
    access_key_id: your_godaddy_key
    access_key_secret: your_godaddy_secret
    enable: false
    domains:
      - "example.com"
  ali_cloud:
    - region_id: "cn-hangzhou"
      access_key_id: "your_ali_ak"
      access_key_secret: "your_ali_sk"
      enable: false
      account_name: "阿里云生产账号"
  aws_cloud:
    - region_id: "ap-east-1"
      access_key_id: "your_aws_ak"
      secret_access_key: "your_aws_sk"
      enable: false
      account_name: "AWS亚太账号"

# Prometheus 监控计算与服务树 HTTP-SD 发现配置
monitor_compute:
  enable: true
  exec_timeout_seconds: 5
  run_interval_seconds: 30
  http_sd_api: http://192.168.50.1:8080/noAuth/getLeafStreeNodeBindIps
  alert_web_hook_addr: http://192.168.50.1:8085/receive

#### IM 机器人告警与通知工具
im:
  feishu:
    enabled: true
    webhook: "https://open.feishu.cn/open-apis/bot/v2/hook/your_feishu_token"
    secret: "your_feishu_secret"
    app_id: your_feishu_app_id
    app_secret: your_feishu_app_secret
    request_timeout_seconds: 5
  dingding:
    enabled: false
    webhook: "https://oapi.dingtalk.com/robot/send?access_token=your_dingtalk_token"
    secret: "your_dingtalk_secret"
  qywx:
    enabled: false
    webhook: "https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=your_qywx_key"